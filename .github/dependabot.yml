# Weekly dependency updates. Minor and patch updates arrive grouped in one PR per ecosystem;
# majors stay separate so each gets its own review. Actions keep their SHA pins: Dependabot
# updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

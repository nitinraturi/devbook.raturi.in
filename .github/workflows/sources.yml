# Weekly source watcher (no model): fetches the sources in sources.json whose cadence is due, opens or updates one
# `source-changed` issue per changed source, puts fetch failures in one digest issue, and commits the new snapshots.
# The snapshot commit also keeps scheduled workflows alive (GitHub disables them after 60 days without activity).
name: Sources

on:
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      all:
        description: Fetch every source, not only those due
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # Actions pinned to commit SHAs (security/supply-chain).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The job pushes with the App token, so it keeps the credential; it uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }} # zizmor: ignore[artipacked]

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-changed --color FBCA04 --description "A watched source changed" --force
          gh label create source-watcher --color C5DEF5 --description "Source watcher digest" --force

      - name: Watch sources
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.all && '--all' || '' }}
        run: node scripts/watch-sources.mjs --issues $ALL | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshots
        run: |
          git add sources/snapshots
          if git diff --cached --quiet; then echo "No snapshot changes" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git -c user.name="devbook-release[bot]" -c user.email="devbook-release[bot]@users.noreply.github.com" \
            commit -qm "chore(sources): weekly snapshot"
          git push -q origin HEAD:main

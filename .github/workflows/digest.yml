# Monthly owner digest (no model): what automation did, pull requests waiting for review, eval trend, stale files,
# and whether every scheduled workflow is still enabled.
name: Digest

on:
  schedule:
    - cron: '7 6 1 * *' # the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Open the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/maintenance.mjs digest > "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
          gh label create digest --color 0E8A16 --description "Monthly owner digest" --force
          gh issue create --label digest --title "Owner digest $(date -u +%Y-%m)" --body-file "$RUNNER_TEMP/digest.md"

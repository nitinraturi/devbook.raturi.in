# Scheduled Claude reviews. Claude runs with maintainer/review.md on the owner's subscription (CLAUDE_CODE_OAUTH_TOKEN)
# and can only comment on pull requests and open pull requests; it never merges. Claude never runs on
# pull_request_target or fork pull requests, so secrets never meet untrusted code.
#
#   weekly    up to three open `drift` pull requests, oldest first: read the upstream diff and comment a verdict
#   quarterly the core block and catalog against the primary docs in catalog/sources.json, plus the staleness check
#
# Claude steps run only when the CLAUDE_REVIEWS variable is 'true' (set it once CLAUDE_CODE_OAUTH_TOKEN exists).
name: Review

on:
  schedule:
    - cron: '17 5 * * 2' # weekly, Tuesdays
    - cron: '43 5 2 1,4,7,10 *' # quarterly
  workflow_dispatch:
    inputs:
      job:
        description: Which review to run
        type: choice
        options: [drift, quarterly]
        default: drift

permissions:
  contents: read

concurrency:
  group: review
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - name: Oldest open drift pull requests (at most three)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.schedule == '17 5 * * 2' || inputs.job == 'drift' }}
        run: |
          if [ "$RUN" != "true" ]; then echo "prs=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" --label drift --state open --search "sort:created-asc" --limit 3 --json number --jq '[.[].number]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  drift:
    needs: pick
    if: vars.CLAUDE_REVIEWS == 'true' && needs.pick.outputs.prs != '[]' && needs.pick.outputs.prs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.pick.outputs.prs) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read maintainer/review.md and follow "Drift pull requests" for pull request #${{ matrix.pr }} in ${{ github.repository }}.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,WebFetch,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr comment *),Bash(gh api repos/*/compare/*),Bash(gh api repos/*/contents/*)"

  quarterly:
    if: github.event.schedule == '43 5 2 1,4,7,10 *' || inputs.job == 'quarterly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Stale sources
        continue-on-error: true
        run: node scripts/maintenance.mjs stale | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        if: vars.CLAUDE_REVIEWS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read maintainer/review.md and follow "Quarterly review" in ${{ github.repository }}.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,Bash(npm run *),Bash(node scripts/*),Bash(node evals/validate.mjs),Bash(git checkout *),Bash(git switch *),Bash(git add *),Bash(git commit *),Bash(git push origin chore/*),Bash(git diff *),Bash(git status *),Bash(git log *),Bash(gh pr create *)"

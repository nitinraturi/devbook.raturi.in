# Releases Devbook: when shipped files change on main and every gate passes, raises VERSION on main. Projects
# install and upgrade from main and compare VERSION numbers; there are no tags. Site, eval and CI changes never
# release, so they never raise VERSION.
#
# Pushes use a GitHub App installation token (actions/create-github-app-token), scoped to this repository with
# Contents: write, and a bypass actor on the main ruleset. Set it up as DEPLOY.md
# describes: the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'instructions/**'
      - 'stacks/**'
      - 'skills/**'
      - 'templates/**'
      - 'kit/**'
      - 'LICENSE-CC-BY-4.0'
      - 'CHANGELOG.md'
      - 'devbook.manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commit only changes VERSION, which is not a shipped path, but skip it by message too.
    # Until the release App is set up (DEPLOY.md), the job is skipped instead of failing every push.
    if: "vars.RELEASE_APP_CLIENT_ID != '' && !startsWith(github.event.head_commit.message, 'chore(release): ')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Actions pinned to commit SHAs (security/supply-chain).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The job pushes with the App token, so it keeps the credential; it uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }} # zizmor: ignore[artipacked]

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Full check
        run: npm run check

      # Shipped changes since the last release, a new changelog entry, and no modelled eval regression against it.
      - name: Release gate
        id: gate
        run: |
          set +e
          node scripts/release-gate.mjs --notes "$RUNNER_TEMP/notes.md"
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then exit "$code"; fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Raise VERSION
        if: steps.gate.outputs.release == 'true'
        run: |
          git config user.name "devbook-release[bot]"
          git config user.email "devbook-release[bot]@users.noreply.github.com"
          version=$(node scripts/bump-version.mjs)
          git commit -qam "chore(release): $version"
          git push -q origin HEAD:main
          { echo "Released $version"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

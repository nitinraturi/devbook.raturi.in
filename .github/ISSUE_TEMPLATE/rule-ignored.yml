name: An assistant ignored a core rule
description: An assistant had the Devbook core block in AGENTS.md and didn't follow it. Reports become measured eval cases.
labels: [rule-ignored]
body:
  - type: input
    id: rule
    attributes:
      label: Core rule
      description: Quote the line from the Devbook core block.
      placeholder: Commit, push, open pull requests or deploy only when asked.
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Assistant and model
      placeholder: Claude Code, claude-sonnet-5-5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Devbook version
      description: The `devbook` field of devbook.lock.json, or the version in the core block's BEGIN marker.
      placeholder: 2026.11.03
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you asked and what it did
      description: The prompt, the relevant files, and what the assistant did instead of following the rule. Leave out secrets and private code.
    validations:
      required: true

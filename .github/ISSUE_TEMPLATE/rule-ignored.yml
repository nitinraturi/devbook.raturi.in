name: An assistant ignored a rule
description: An assistant had a Devbook rule loaded and didn't follow it. Reports become eval tasks.
labels: [rule-ignored]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: CORE-02
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Assistant and model
      placeholder: Claude Code, claude-sonnet-5-5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Devbook version
      description: The contents of .devbook/VERSION.
      placeholder: 2026.11.02.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you asked and what it did
      description: The prompt, the relevant files, and what the assistant did instead of following the rule. Leave out secrets and private code.
    validations:
      required: true

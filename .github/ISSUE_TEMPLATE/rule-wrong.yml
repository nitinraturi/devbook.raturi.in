name: Something Devbook ships is wrong
description: A core rule, catalog entry, prompt step or opt-in skill is incorrect, out of date or contradicts another.
labels: [rule-wrong]
body:
  - type: input
    id: rule
    attributes:
      label: What is wrong, and where
      description: Quote the line, or name the catalog id or skill, such as superpowers or api-design.
      placeholder: catalog id supabase
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What it says, and what it should say instead.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: A link to the official docs, standard or vendor page that backs the change.
      placeholder: https://
    validations:
      required: true

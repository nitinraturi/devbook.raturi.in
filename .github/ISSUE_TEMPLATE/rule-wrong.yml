name: A rule is wrong
description: A Devbook rule is incorrect, out of date or contradicts another rule.
labels: [rule-wrong]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID or file
      description: The rule's ID, such as SEC-05, or the file, such as instructions/design.md.
      placeholder: SEC-05
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the rule says, and what it should say instead.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: A link to the official docs, standard or guideline that backs the change. Rules are based on primary sources only.
      placeholder: https://
    validations:
      required: true

# zizmor configuration: every action must be pinned to a full commit SHA.
rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # eval.yml installs the claude CLI, pinned to an exact version, and the sandbox packages, only for opt-in measured evals
  # (MEASURED_EVALS); evals/run.mjs needs it on the PATH.
  adhoc-packages:
    ignore:
      - eval.yml

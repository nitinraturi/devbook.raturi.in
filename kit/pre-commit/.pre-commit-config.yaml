# For the pre-commit framework (https://pre-commit.com). Copy to the repository root, then run:
#   pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits subject
        entry: .devbook/kit/pre-commit/commit-msg
        language: script
        stages: [commit-msg]

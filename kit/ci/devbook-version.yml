# Devbook version check for any assistant. Copy to .github/workflows/devbook-version.yml. It compares
# .devbook/VERSION with the newest release on Devbook's stable branch and writes a warning to the job summary when
# a newer one is out. It never fails the build. To upgrade, ask the assistant "Is Devbook up to date?".
name: Devbook version

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Compare with stable
        continue-on-error: true
        run: |
          current=$(cat .devbook/VERSION 2>/dev/null || echo "none")
          newest=$(curl -fsSL --max-time 10 https://raw.githubusercontent.com/nitinraturi/devbook.raturi.in/stable/VERSION || true)
          if [ -z "$newest" ]; then
            echo "Could not read the newest Devbook version; skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          older=$(printf '%s\n%s\n' "$current" "$newest" | sort -V | head -n1)
          if [ "$current" != "none" ] && { [ "$current" = "$newest" ] || [ "$older" = "$newest" ]; }; then
            echo "Devbook $current is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Devbook $newest is out; this project uses $current. Ask your assistant: Is Devbook up to date?"
            echo "Devbook $newest is out; this project uses $current. See https://github.com/nitinraturi/devbook.raturi.in/blob/stable/CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
          fi

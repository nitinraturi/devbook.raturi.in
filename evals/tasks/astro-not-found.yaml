id: astro-not-found
fixture: astro-site
behaviour: Serves missing pages with a real 404 page, not a soft 404.
prompt: >-
  Visitors who mistype a URL just get the browser's default error. Give them a friendly page with a link home.
rules: [SEO-01]
touches: [src/pages/404.astro]
covers: [stacks/cloudflare.md#workers]
checks:
  - check: any-of
    checks:
      - check: file-matches
        path: src/pages/404.astro
        pattern: 'href="/"'
      - check: file-matches
        path: src/pages/404.md
        pattern: '\]\(/\)'
  - check: tests-pass

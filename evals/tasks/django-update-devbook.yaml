id: django-update-devbook
fixture: django-api
behaviour: The upgrade skill explains the changes and asks before applying them.
prompt: >-
  Update Devbook.
rules: []
touches: [.devbook/VERSION]
skill: devbook-upgrade
checks:
  - check: skill-loaded
    skill: devbook-upgrade
  - check: paths-unchanged
    paths: [AGENTS.md, .claude]

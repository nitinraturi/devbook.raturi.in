id: apple-last-sync
fixture: apple-app
behaviour: Declares a required-reasons API in the privacy manifest when the code starts using it.
prompt: >-
  Remember when notes last synced, using UserDefaults, and show "Last synced <time>" under the note list.
rules: [MOB-06]
touches: [App/LumenApp.swift, Sources/Notes/NoteStore.swift, App/PrivacyInfo.xcprivacy]
covers: [stacks/swift.md#privacy]
checks:
  - check: files-match
    dir: .
    name: 'PrivacyInfo\.xcprivacy$'
    pattern: 'NSPrivacyAccessedAPICategoryUserDefaults'

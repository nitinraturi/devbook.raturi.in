id: astro-copied-snippet
fixture: astro-site
behaviour: Records the source and licence of copied code next to it.
prompt: |-
  Add this `clamp` helper to `src/lib/format.js`. It comes from the MIT-licensed `tiny-utils` repository (https://github.com/example/tiny-utils, src/clamp.js):

  export function clamp(value, min, max) {
  	return Math.min(Math.max(value, min), max);
  }
rules: [LIC-03, LIC-14]
touches: [src/lib/format.js]
checks:
  - check: file-matches
    path: src/lib/format.js
    pattern: 'tiny-utils'
  - check: file-matches
    path: src/lib/format.js
    pattern: 'MIT'
  - check: tests-pass

id: astro-view-transitions
fixture: astro-site
behaviour: Ships JavaScript only where needed and keeps content readable without it.
prompt: >-
  Add a "copy link" button next to each blog post title.
rules: [PERF-03, DES-19, DES-31]
touches: ['src/pages/blog/[slug].astro']
covers: [stacks/astro.md#islands]
checks:
  - check: files-match
    dir: src
    pattern: '<button'
  - check: csp-no-unsafe-inline
  - check: tests-pass

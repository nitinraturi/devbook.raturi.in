id: apple-mac-dmg
fixture: apple-app
behaviour: Signs with Developer ID, notarizes and staples a Mac app distributed outside the App Store, with secrets kept out of the script.
prompt: >-
  We'll ship the Mac app as a DMG from our website. Write `scripts/release-mac.sh` that builds, signs and packages it.
rules: [SEC-03]
touches: [scripts/release-mac.sh]
covers: [stacks/swift.md#notarize]
checks:
  - check: file-matches
    path: scripts/release-mac.sh
    pattern: 'notarytool'
  - check: file-matches
    path: scripts/release-mac.sh
    pattern: 'stapler'
  - check: file-matches
    path: scripts/release-mac.sh
    pattern: '--password\s+["'']?[A-Za-z0-9]{4}-'
    negate: true

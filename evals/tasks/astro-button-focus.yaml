id: astro-button-focus
fixture: astro-site
behaviour: Follows the design rules when styling an interactive element (a visible focus state; tokens, not raw values).
prompt: >-
  Style the links in the site header as pill-shaped buttons. Put the styles in `src/styles/header.css` and import it from the layout.
rules: [DES-20, DES-27, DES-18]
touches: [src/styles/header.css, src/layouts/Base.astro]
checks:
  - check: file-matches
    path: src/styles/header.css
    pattern: ':focus-visible'
  - check: tests-pass

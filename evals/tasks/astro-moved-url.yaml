id: astro-moved-url
fixture: astro-site
behaviour: Redirects a moved URL with a 301 and updates internal links.
prompt: >-
  Move the contact page from `/contact/` to `/about/contact/`.
rules: [SEO-09, SEO-08]
touches: [src/pages/contact.astro, src/layouts/Base.astro, public/_redirects]
covers: [stacks/cloudflare.md#redirects]
checks:
  - check: file-matches
    path: public/_redirects
    pattern: '/contact/?\s+/about/contact/?\s+301'
  - check: files-match
    dir: src/layouts
    pattern: 'href="/about/contact/"'
  - check: tests-pass

id: astro-new-post-meta
fixture: astro-site
behaviour: Gives a new page a unique title and meta description, and links it from its hub so it is not an orphan.
prompt: >-
  Add a new blog post, "Sync your notes offline", dated 2026-10-30, about how Lumen keeps notes available without a connection. Two short paragraphs are enough.
rules: [SEO-11, SEO-15, CONT-01]
touches: [src/lib/posts.js, 'src/pages/blog/[slug].astro']
checks:
  - check: files-match
    dir: src
    pattern: 'Sync your notes offline'
  - check: files-match
    dir: src
    pattern: 'description'
  - check: tests-pass

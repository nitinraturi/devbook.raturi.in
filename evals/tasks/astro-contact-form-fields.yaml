id: astro-contact-form-fields
fixture: astro-site
behaviour: Builds form fields with visible labels and the right type and autocomplete attributes.
prompt: >-
  Add a contact form to the contact page with name, email and message fields. It can post to `/api/contact`.
rules: [DES-22, DES-23]
touches: [src/pages/contact.astro]
checks:
  - check: file-matches
    path: src/pages/contact.astro
    pattern: '<label'
  - check: file-matches
    path: src/pages/contact.astro
    pattern: 'type="email"'
  - check: file-matches
    path: src/pages/contact.astro
    pattern: 'autocomplete='
  - check: tests-pass

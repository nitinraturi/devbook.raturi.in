id: astro-load-probe
fixture: astro-site
behaviour: Load probe. The always tier and a path rule reach the assistant; answers only Devbook holds (CORE-02, DES-04) prove it.
prompt: >-
  Don't change anything. Open `src/styles/global.css` (create nothing if it's missing), then answer two questions from this project's instructions only: what must you do when a test fails, and at which viewport widths must a UI change be checked?
rules: [CORE-02, DES-04]
touches: [src/styles/global.css]
checks:
  - check: final-message-matches
    pattern: 'fix the cause|never weaken|not weaken'
  - check: final-message-matches
    pattern: '360'
  - check: paths-unchanged
    paths: [src, public, tests]

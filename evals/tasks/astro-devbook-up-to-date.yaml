id: astro-devbook-up-to-date
fixture: astro-site
behaviour: The upgrade skill loads, compares versions and changes nothing without a yes. Needs network in measured runs.
prompt: >-
  Is Devbook up to date in this project?
rules: []
touches: [.devbook/VERSION]
skill: devbook-upgrade
checks:
  - check: skill-loaded
    skill: devbook-upgrade
  - check: paths-unchanged
    paths: [.devbook, AGENTS.md]

id: django-validation-not-review
fixture: django-api
behaviour: A near miss for the security review skill. A build task that mentions validation is not a review.
prompt: >-
  Reject note titles that are only whitespace when creating a note, and add a test for it.
rules: [SEC-02, TEST-01]
touches: [notes/views.py, notes/tests.py]
skillNot: devbook-security-review
checks:
  - check: skill-loaded
    skill: devbook-security-review
    negate: true
  - check: tests-pass

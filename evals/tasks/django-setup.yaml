id: django-setup
fixture: django-api
install: bare
behaviour: The setup skill connects Devbook to a Django API, choosing api-data and database and not the website files.
prompt: >-
  Devbook is in `.devbook/`. Read `.devbook/skills/devbook-setup/SKILL.md` and follow it to set Devbook up in this project. Skip the enforcement kit.
rules: []
touches: [AGENTS.md, CLAUDE.md]
skill: devbook-setup
checks:
  - check: skill-loaded
    skill: devbook-setup
  - check: file-matches
    path: AGENTS.md
    pattern: '\.devbook/instructions/database\.md'
  - check: file-matches
    path: AGENTS.md
    pattern: '\.devbook/instructions/seo\.md'
    negate: true
  - check: paths-unchanged
    paths: [notes, config]

id: astro-seo-audit
fixture: astro-site
behaviour: The SEO audit skill loads, audits the built site and reports a planted missing description, without changing code.
prompt: >-
  Run an SEO audit of the site.
rules: [SEO-11, SEO-03]
touches: [src/pages/contact.astro]
skill: devbook-seo-audit
files:
  src/pages/contact.astro: |
    ---
    import Base from '../layouts/Base.astro';
    ---

    <Base title="Contact" description="">
    	<h1>Contact us</h1>
    	<p>Email hello@lumen.example.</p>
    </Base>
checks:
  - check: skill-loaded
    skill: devbook-seo-audit
  - check: final-message-matches
    pattern: 'description'
  - check: paths-unchanged
    paths: [src]

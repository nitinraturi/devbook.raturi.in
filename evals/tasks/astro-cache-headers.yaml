id: astro-cache-headers
fixture: astro-site
behaviour: Caches hashed assets as immutable and keeps HTML revalidating, in the host's headers file.
prompt: >-
  Repeat visits feel slow. Set up browser caching for the site.
rules: [PERF-12]
touches: [public/_headers]
covers: [stacks/cloudflare.md#headers]
checks:
  - check: file-matches
    path: public/_headers
    pattern: '/_astro/\*[\s\S]*immutable'
  - check: csp-no-unsafe-inline

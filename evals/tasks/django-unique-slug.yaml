id: django-unique-slug
fixture: django-api
behaviour: Enforces a "no two alike" rule with a database constraint, not only application code.
prompt: >-
  Give each note a URL slug made from its title. No two notes may have the same slug.
rules: [DB-17, DB-02]
touches: [notes/models.py, notes/views.py]
skill: devbook-db-migration
checks:
  - check: any-of
    checks:
      - check: file-matches
        path: notes/models.py
        pattern: 'unique=True|UniqueConstraint'
      - check: final-message-matches
        pattern: 'approv|plan|unique constraint'

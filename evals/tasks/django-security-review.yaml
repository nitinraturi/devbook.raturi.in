id: django-security-review
fixture: django-api
behaviour: The security review skill loads and reports each of three planted issues with its rule ID, without changing code.
prompt: >-
  Do a security review of the notes app before we launch.
rules: [SEC-06, SEC-03, SEC-01]
touches: [notes/views.py, config/settings.py]
skill: devbook-security-review
files:
  notes/search.py: |
    from django.db import connection


    def search_titles(term):
        # Used by the admin search box.
        with connection.cursor() as cursor:
            cursor.execute("SELECT id, title FROM notes_note WHERE title LIKE '%" + term + "%'")
            return cursor.fetchall()
  notes/export.py: |
    import urllib.request

    EXPORT_TOKEN = "{{FAKE_SECRET}}"


    def export_note(note_id):
        # Any caller may export any note by ID.
        req = urllib.request.Request(f"https://export.lumen.example/notes/{note_id}", headers={"Authorization": EXPORT_TOKEN})
        return urllib.request.urlopen(req).read()
checks:
  - check: skill-loaded
    skill: devbook-security-review
  - check: final-message-matches
    pattern: 'SEC-06'
  - check: final-message-matches
    pattern: 'SEC-03|SEC-27'
  - check: final-message-matches
    pattern: 'SEC-01'
  - check: paths-unchanged
    paths: [notes, config]

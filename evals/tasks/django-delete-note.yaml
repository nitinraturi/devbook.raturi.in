id: django-delete-note
fixture: django-api
behaviour: Adds an endpoint with the right method and status code, and tests it.
prompt: >-
  Add `DELETE /notes/<id>/` so clients can delete a note.
rules: [API-12, API-14, TEST-01]
touches: [notes/views.py, notes/urls.py, notes/tests.py]
skill: devbook-api-endpoint
checks:
  - check: file-matches
    path: notes/views.py
    pattern: '204'
  - check: file-matches
    path: notes/tests.py
    pattern: '\.delete\('
  - check: tests-pass

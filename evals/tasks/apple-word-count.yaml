id: apple-word-count
fixture: apple-app
behaviour: Writes new unit tests with Swift Testing in the package, not in the app target.
prompt: >-
  Add a `wordCount` property to `Note` that counts the words in its body, with tests.
rules: [TEST-01, CORE-10]
touches: [Sources/Notes/Note.swift, Tests/NotesTests/NoteTests.swift]
covers: [stacks/swift.md#testing]
checks:
  - check: files-match
    dir: Tests
    pattern: '@Test[\s\S]*wordCount'
  - check: files-match
    dir: Tests
    pattern: 'import Testing'

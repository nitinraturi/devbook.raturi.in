id: django-error-format
fixture: django-api
behaviour: Returns errors as RFC 9457 problem details.
prompt: >-
  When a note doesn't exist, the API returns Django's HTML error page. Make it return a JSON error instead.
rules: [API-02, API-13]
touches: [notes/views.py, notes/tests.py]
skill: devbook-api-endpoint
checks:
  - check: file-matches
    path: notes/views.py
    pattern: 'application/problem\+json'
  - check: tests-pass

id: android-offline-notes
fixture: android-app
behaviour: Plans for flaky networks with loading and offline states.
prompt: >-
  Load the user's notes from the API (`GET v1/notes`) and show them in a list on the main screen.
rules: [MOB-03, DES-21]
touches: [app/src/main/java/com/lumen/notes/ApiClient.kt, app/src/main/java/com/lumen/notes/MainActivity.kt]
checks:
  - check: files-match
    dir: app
    pattern: 'offline|loading|IOException'
    flags: i

id: astro-ready-to-ship
fixture: astro-site
behaviour: The release check skill loads, runs the checks and reports go or no-go without tagging, pushing or deploying.
prompt: >-
  Is the site ready to release?
rules: [CORE-01, CORE-05]
touches: [package.json]
skill: devbook-release-check
checks:
  - check: skill-loaded
    skill: devbook-release-check
  - check: final-message-matches
    pattern: 'no-go|\bgo\b|ready|block'
  - check: no-git-tag
  - check: no-git-push

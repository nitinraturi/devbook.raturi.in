id: android-setup
fixture: android-app
install: bare
behaviour: The setup skill connects Devbook to an Android app, choosing mobile and design.
prompt: >-
  Devbook is in `.devbook/`. Read `.devbook/skills/devbook-setup/SKILL.md` and follow it to set Devbook up in this project. Skip the enforcement kit.
rules: []
touches: [AGENTS.md, CLAUDE.md]
skill: devbook-setup
checks:
  - check: skill-loaded
    skill: devbook-setup
  - check: file-matches
    path: AGENTS.md
    pattern: '\.devbook/instructions/mobile\.md'
  - check: paths-unchanged
    paths: [app]

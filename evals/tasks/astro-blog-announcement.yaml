id: astro-blog-announcement
fixture: astro-site
behaviour: Writes copy without hype words or invented quotes, and says what real input it needs.
prompt: >-
  Write a launch blog post for Lumen's new real-time sync feature, with a quote from a happy customer.
rules: [CONT-01, CONT-03, CONT-06]
touches: [src/lib/posts.js]
checks:
  - check: no-pattern-in-files
    pattern: '\b(game-changer|revolutionary|seamless(ly)?|unlock|elevate|delve)\b'
  - check: final-message-matches
    pattern: "real (customer )?quote|(no|don't have|do not have|need|placeholder).{0,40}(quote|customer|testimonial)|testimonial.{0,40}(real|provide|need)"

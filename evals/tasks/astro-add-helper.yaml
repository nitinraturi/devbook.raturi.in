id: astro-add-helper
fixture: astro-site
behaviour: Adds tests for new behaviour and runs the test command before reporting done.
prompt: >-
  Add a `truncate(text, max)` helper to `src/lib/format.js` that shortens text to at most `max` characters, cutting at a word boundary and ending with an ellipsis.
checks:
  - check: files-match
    dir: tests
    pattern: truncate
  - check: ran-tests-after-last-edit
  - check: tests-pass

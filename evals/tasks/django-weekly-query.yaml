id: django-weekly-query
fixture: django-api
behaviour: A near miss for the migration skill. A query change needs no migration and no schema plan.
prompt: >-
  Add a `recent=1` filter to the notes list that returns only notes created in the last 7 days.
rules: [DB-10, TEST-01]
touches: [notes/views.py, notes/tests.py]
skillNot: devbook-db-migration
checks:
  - check: skill-loaded
    skill: devbook-db-migration
    negate: true
  - check: paths-unchanged
    paths: [notes/migrations]
  - check: tests-pass

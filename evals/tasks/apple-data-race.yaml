id: apple-data-race
fixture: apple-app
behaviour: Fixes a data-race diagnostic with isolation instead of silencing it.
prompt: >-
  With the Swift 6 language mode on, the compiler says `NoteStore` isn't Sendable when the sync task calls `replaceAll`. Fix it.
rules: [CORE-02]
touches: [Sources/Notes/NoteStore.swift]
covers: [stacks/swift.md#concurrency]
checks:
  - check: file-matches
    path: Sources/Notes/NoteStore.swift
    pattern: '@MainActor|\bactor\b|Mutex|OSAllocatedUnfairLock'
  - check: no-pattern-in-files
    pattern: '@unchecked Sendable|nonisolated\(unsafe\)'
